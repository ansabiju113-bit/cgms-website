# Jan-Suraksha Spring Boot & SQL Database Configuration
server.port=8080
spring.application.name=Jan-Suraksha CGMS

# Static Web Resources mapping
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# File Upload / Photo Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# SQL DATABASE CONFIGURATION (Spring Data JPA)
# ==============================================================================

# H2 SQL Database (Default: Embedded, zero external installation required)
spring.datasource.url=jdbc:h2:mem:cgmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Interactive Web SQL Console: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate ORM Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Initialization
spring.sql.init.mode=always

# ==============================================================================
# (OPTIONAL) MYSQL CONFIGURATION - Uncomment below to switch to MySQL Server
# ==============================================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/cgms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.com.jansuraksha=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
